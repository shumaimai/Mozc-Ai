// AI統合Mozc IME 設定ファイル
// AI configuration for Mozc IME integration

syntax = "proto3";
package mozc.ai;

option cc_enable_arenas = true;

message AIConfig {
  // 有効/無効
  bool enabled = 1;  // デフォルト: true

  // バックエンド選択
  BackendType backend_type = 2;
  enum BackendType {
    DISABLED = 0;
    OLLAMA = 1;
    GROQ = 2;
  }

  // Ollama設定
  OllamaConfig ollama = 3;

  // Groq設定
  GroqConfig groq = 4;

  // タイムアウト設定（フリーズ防止の要）
  TimeoutConfig timeout = 5;

  // キャッシュ設定
  CacheConfig cache = 6;

  // コンテキスト設定
  ContextConfig context = 7;

  // ログ設定
  LogConfig log = 8;

  // デバッグ設定
  DebugConfig debug = 9;
}

message OllamaConfig {
  string endpoint = 1;      // デフォルト: "http://localhost:11434"
  string model = 2;         // デフォルト: "gemma3:1b"
}

message GroqConfig {
  string api_key_env = 1;   // 環境変数名: "GROQ_API_KEY"
  string model = 2;         // デフォルト: "mixtral-8x7b-32768"
}

// フリーズ防止の核心
message TimeoutConfig {
  // 接続タイムアウト（非常に短く）
  int32 connect_timeout_ms = 1;  // デフォルト: 50ms

  // 処理タイムアウト
  int32 request_timeout_ms = 2;  // デフォルト: 500ms

  // 最大待機時間（これを超えたら絶対に諦める）
  int32 max_wait_ms = 3;         // デフォルト: 600ms

  // ウォームアップタイムアウト
  int32 warmup_timeout_ms = 4;   // デフォルト: 60000 (60秒)
}

message CacheConfig {
  // キャッシュ有効期限
  int32 ttl_seconds = 1;         // デフォルト: 60

  // 最大キャッシュエントリ数
  int32 max_entries = 2;         // デフォルト: 100

  // コンテキストをキャッシュキーに含めるか
  bool include_context_in_key = 3;  // デフォルト: true
}

message ContextConfig {
  // 履歴保持数
  int32 history_size = 1;        // デフォルト: 5

  // 履歴有効期限（分）
  int32 history_expire_min = 2;  // デフォルト: 5
}

message LogConfig {
  // ログレベル
  LogLevel level = 1;
  enum LogLevel {
    TRACE = 0;
    DEBUG = 1;
    INFO = 2;
    WARN = 3;
    ERROR = 4;
  }

  // AI通信ログ（デバッグ用）
  bool log_ai_communication = 2;  // デフォルト: false
}

message DebugConfig {
  // AI機能無効化
  bool disable_ai = 1;

  // モックモード
  bool use_mock = 2;
}
