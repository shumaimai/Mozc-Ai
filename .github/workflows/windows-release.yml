name: Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mozc_ref:
        description: Mozc git ref (branch/tag/commit)
        required: false
        default: ""
      release_tag:
        description: Attach MSI to this release tag (e.g. v0.0.1). Leave empty for artifact only.
        required: false
        default: ""

env:
  MOZC_PIN_SHA: "3f235b4eb6fcff7d14ef5f0fb8ee56de7ee4c732"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_msi:
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Checkout AI Mozc
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set UTF-8 for Python
        shell: pwsh
        run: |
          echo "PYTHONUTF8=1" >> $env:GITHUB_ENV
          echo "PYTHONIOENCODING=utf-8" >> $env:GITHUB_ENV

      - name: Clone Mozc
        shell: pwsh
        run: |
          $mozcRef = "${{ github.event.inputs.mozc_ref }}"
          if ([string]::IsNullOrWhiteSpace($mozcRef)) {
            $mozcRef = $env:MOZC_PIN_SHA
          }
          Write-Host "Cloning Mozc at ref: $mozcRef"
          git clone --depth 1 https://github.com/google/mozc.git .mozc-build/mozc
          Push-Location .mozc-build/mozc
          git fetch --depth 1 origin $mozcRef
          git checkout $mozcRef
          Pop-Location

      - name: Integrate AI module
        shell: pwsh
        run: |
          python scripts/integrate_mozc.py --mozc-dir .mozc-build/mozc/src
          python scripts/integrate_mozc_installer.py --mozc-dir .mozc-build/mozc/src

      - name: Cache Mozc third_party
        uses: actions/cache@v4
        with:
          path: .mozc-build/mozc/src/third_party_cache
          key: mozc-deps-${{ runner.os }}-${{ env.MOZC_PIN_SHA }}-${{ hashFiles('.mozc-build/mozc/src/build_tools/update_deps.py') }}
          restore-keys: |
            mozc-deps-${{ runner.os }}-${{ env.MOZC_PIN_SHA }}-
            mozc-deps-${{ runner.os }}-

      - name: Cache Qt build
        uses: actions/cache@v4
        with:
          path: .mozc-build/mozc/src/third_party/qt
          key: mozc-qt-${{ runner.os }}-${{ env.MOZC_PIN_SHA }}
          restore-keys: |
            mozc-qt-${{ runner.os }}-

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            .mozc-build/mozc/src/bazel-*
            ~/.cache/bazel
          key: mozc-bazel-${{ runner.os }}-${{ env.MOZC_PIN_SHA }}-${{ hashFiles('scripts/integrate_mozc.py', 'scripts/integrate_mozc_installer.py', 'src/**', 'mozc_compat/**') }}
          restore-keys: |
            mozc-bazel-${{ runner.os }}-${{ env.MOZC_PIN_SHA }}-
            mozc-bazel-${{ runner.os }}-

      - name: Download Mozc dependencies
        shell: cmd
        working-directory: .mozc-build/mozc/src
        run: python build_tools/update_deps.py

      - name: Build Qt
        shell: cmd
        working-directory: .mozc-build/mozc/src
        run: python build_tools/build_qt.py --release --confirm_license

      - name: Delete Qt source to save disk space
        shell: cmd
        working-directory: .mozc-build/mozc/src
        run: rmdir third_party\qt_src /s /q

      - name: Build MozcAI64.msi
        shell: cmd
        working-directory: .mozc-build/mozc/src
        env:
          ANDROID_NDK_HOME: ""
        run: bazelisk build package --config release_build

      - name: Verify AI binary before packaging
        shell: pwsh
        run: |
          $exe = ".mozc-build/mozc/src/bazel-bin/server/mozc_server.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "mozc_server.exe not found at $exe"
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch "AIRewriter") {
            Write-Error "AIRewriter marker not found in mozc_server.exe"
            exit 1
          }
          if ($text -notmatch "deepseek") {
            Write-Error "deepseek marker not found in mozc_server.exe"
            exit 1
          }
          Write-Host "AI markers verified in mozc_server.exe ($($bytes.Length) bytes)"

      - name: Copy MSI to dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item .mozc-build/mozc/src/bazel-bin/win32/installer/MozcAI64.msi dist/MozcAI64.msi

      - name: Verify MSI contents
        shell: pwsh
        run: |
          $msi = "dist/MozcAI64.msi"
          if (-not (Test-Path $msi)) {
            Write-Error "MSI not found"
            exit 1
          }
          $size = (Get-Item $msi).Length
          if ($size -lt 10MB) {
            Write-Error "MSI too small ($size bytes)"
            exit 1
          }
          Write-Host "MSI size OK: $size bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MozcAI64.msi
          path: dist/MozcAI64.msi
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          files: dist/MozcAI64.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
